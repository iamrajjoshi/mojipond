name: Pages

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/pages.yml"
      - "docs/screenshots/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "website/**"
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Pages site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install website dependencies
        run: pnpm install --frozen-lockfile

      - name: Stage the latest public release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p website/public/releases
          echo "PUBLIC_DOWNLOAD_URL=" >> "${GITHUB_ENV}"

          release_tag="$(
            gh release list \
              --exclude-drafts \
              --exclude-pre-releases \
              --limit 1 \
              --json tagName \
              --jq '.[0].tagName // empty'
          )"
          if [[ -z "${release_tag}" ]]; then
            echo "No stable release exists yet; keeping the committed empty appcast."
            exit 0
          fi
          release_json="$(
            gh release view "${release_tag}" --json tagName,assets
          )"

          has_appcast="$(
            jq -r 'any(.assets[]; .name == "appcast.xml")' \
              <<<"${release_json}"
          )"
          has_dmg="$(
            jq -r 'any(.assets[]; .name == "MojiPond.dmg")' \
              <<<"${release_json}"
          )"
          if [[ "${has_appcast}" != "true" || "${has_dmg}" != "true" ]]; then
            echo "Stable release ${release_tag} is missing appcast.xml or MojiPond.dmg." >&2
            exit 1
          fi

          echo \
            "PUBLIC_DOWNLOAD_URL=https://github.com/${GITHUB_REPOSITORY}/releases/download/${release_tag}/MojiPond.dmg" \
            >> "${GITHUB_ENV}"

          gh release download \
            "${release_tag}" \
            --pattern 'appcast.xml' \
            --dir website/public/releases \
            --clobber

          appcast_path=website/public/releases/appcast.xml
          expected_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${release_tag}/MojiPond.zip"
          if ! grep -Fq "url=\"${expected_url}\"" "${appcast_path}"; then
            echo "The appcast does not reference the immutable ${release_tag} ZIP." >&2
            exit 1
          fi
          if ! grep -Fq 'sparkle:edSignature=' "${appcast_path}" \
              || ! grep -Fq '<!-- sparkle-signatures:' "${appcast_path}"; then
            echo "The appcast is missing an update or feed signature." >&2
            exit 1
          fi

      - name: Build website
        run: pnpm site:build

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/dist

  deploy:
    name: Deploy Pages site
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
