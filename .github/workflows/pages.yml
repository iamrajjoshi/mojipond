name: Pages

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/pages.yml"
      - "docs/screenshots/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "website/**"
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Pages site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install website dependencies
        run: pnpm install --frozen-lockfile

      - name: Stage the latest public release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p website/public/releases

          release_tag="$(
            gh release list \
              --exclude-drafts \
              --limit 1 \
              --json tagName \
              --jq '.[0].tagName // empty'
          )"
          if [[ -z "${release_tag}" ]]; then
            echo "No published release exists yet; the site will show preview status."
            exit 0
          fi
          release_json="$(
            gh release view "${release_tag}" --json tagName,assets
          )"

          dmg_size="$(
            jq -r '.assets[] | select(.name == "MojiPond.dmg") | .size' \
              <<<"${release_json}"
          )"
          if [[ -z "${dmg_size}" || "${dmg_size}" == "null" ]]; then
            echo "The latest release does not contain MojiPond.dmg." >&2
            exit 1
          fi

          gh release download \
            "${release_tag}" \
            --pattern 'MojiPond.dmg' \
            --pattern 'MojiPond.zip' \
            --pattern 'SHA256SUMS.txt' \
            --dir website/public/releases
          has_update_feed="$(
            jq -r 'any(.assets[]; .name == "update-feed.json")' \
              <<<"${release_json}"
          )"
          if [[ "${has_update_feed}" == "true" ]]; then
            gh release download \
              "${release_tag}" \
              --pattern 'update-feed.json' \
              --dir website/public/releases
          else
            echo "No signed updater feed is attached to this release yet."
          fi

          version="$(jq -r '.tagName | ltrimstr("v")' <<<"${release_json}")"
          pnpm --filter @mojipond/site release-manifest \
            "${version}" \
            "${dmg_size}" \
            public/releases/release.json

      - name: Build website
        run: pnpm site:build

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: website/dist

  deploy:
    name: Deploy Pages site
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
