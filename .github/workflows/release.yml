name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version from MARKETING_VERSION, without a leading v
        required: true
        type: string
      build:
        description: Integer from CURRENT_PROJECT_VERSION
        required: true
        type: string
      prerelease:
        description: Mark the draft as a prerelease
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release source
    if: github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 35

    steps:
      - name: Check out protected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate version inputs
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          REQUESTED_BUILD: ${{ inputs.build }}
        shell: bash
        run: |
          set -euo pipefail
          project_version="$(
            sed -nE 's/^[[:space:]]*MARKETING_VERSION:[[:space:]]*"([^"]+)"/\1/p' \
              project.yml \
              | head -n 1
          )"
          project_build="$(
            sed -nE 's/^[[:space:]]*CURRENT_PROJECT_VERSION:[[:space:]]*"([^"]+)"/\1/p' \
              project.yml \
              | head -n 1
          )"
          if [[ "${REQUESTED_VERSION}" != "${project_version}" \
                || "${REQUESTED_BUILD}" != "${project_build}" ]]; then
            echo "Release inputs must match project.yml (${project_version}, build ${project_build})." >&2
            exit 1
          fi
          if [[ ! "${REQUESTED_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ \
                || ! "${REQUESTED_BUILD}" =~ ^[1-9][0-9]*$ ]]; then
            echo "Use a semantic version and a positive integer build." >&2
            exit 1
          fi

      - name: Install pinned XcodeGen
        env:
          XCODEGEN_VERSION: 2.46.0
          XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
        run: |
          mkdir -p .derived/tools
          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip" \
            --output .derived/tools/xcodegen.zip
          printf '%s  %s\n' \
            "${XCODEGEN_SHA256}" \
            ".derived/tools/xcodegen.zip" \
            | shasum -a 256 -c -
          ditto -x -k .derived/tools/xcodegen.zip .derived/tools
          echo "${GITHUB_WORKSPACE}/.derived/tools/xcodegen/bin" >> "${GITHUB_PATH}"

      - name: Run deterministic tests
        run: ./scripts/test.sh

  release:
    name: Sign, notarize, and draft release
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: write
    environment:
      name: production-release

    steps:
      - name: Check out verified source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned XcodeGen
        env:
          XCODEGEN_VERSION: 2.46.0
          XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
        run: |
          mkdir -p .derived/tools
          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip" \
            --output .derived/tools/xcodegen.zip
          printf '%s  %s\n' \
            "${XCODEGEN_SHA256}" \
            ".derived/tools/xcodegen.zip" \
            | shasum -a 256 -c -
          ditto -x -k .derived/tools/xcodegen.zip .derived/tools
          echo "${GITHUB_WORKSPACE}/.derived/tools/xcodegen/bin" >> "${GITHUB_PATH}"

      - name: Resolve pinned Sparkle release tools
        id: sparkle
        shell: bash
        run: |
          set -euo pipefail
          xcodegen generate
          xcodebuild \
            -resolvePackageDependencies \
            -project MojiPond.xcodeproj \
            -scheme MojiPond \
            -derivedDataPath .derived/SparkleTools

          resolved_version="$(
            jq -er \
              '.object.dependencies[]
                | select(.packageRef.identity == "sparkle")
                | .state.checkoutState.version' \
              .derived/SparkleTools/SourcePackages/workspace-state.json
          )"
          if [[ "${resolved_version}" != "2.9.5" ]]; then
            echo "Expected Sparkle 2.9.5, resolved ${resolved_version:-nothing}." >&2
            exit 1
          fi

          sparkle_bin="${GITHUB_WORKSPACE}/.derived/SparkleTools/SourcePackages/artifacts/sparkle/Sparkle/bin"
          generate_appcast="${sparkle_bin}/generate_appcast"
          sign_update="${sparkle_bin}/sign_update"
          for tool in "${generate_appcast}" "${sign_update}"; do
            if [[ ! -x "${tool}" ]]; then
              echo "Missing Sparkle release tool: ${tool}" >&2
              exit 1
            fi
            codesign --verify --deep --strict --verbose=2 "${tool}"
          done

          echo "generate-appcast=${generate_appcast}" >> "${GITHUB_OUTPUT}"
          echo "sign-update=${sign_update}" >> "${GITHUB_OUTPUT}"

      - name: Install pinned Sentry CLI
        env:
          SENTRY_CLI_VERSION: 3.6.2
          SENTRY_CLI_SHA256: d1339bc39b2c681496d70fc0cb5263a6f4ff93939de21b1f34cffb310643ef1c
        run: |
          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            "https://github.com/getsentry/sentry-cli/releases/download/${SENTRY_CLI_VERSION}/sentry-cli-Darwin-universal" \
            --output .derived/tools/sentry-cli
          printf '%s  %s\n' \
            "${SENTRY_CLI_SHA256}" \
            ".derived/tools/sentry-cli" \
            | shasum -a 256 -c -
          chmod 0755 .derived/tools/sentry-cli
          .derived/tools/sentry-cli --version

      - name: Import release credentials
        id: signing
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        shell: zsh {0}
        run: |
          set -euo pipefail
          for secret_value in \
            "${DEVELOPER_ID_P12_BASE64}" \
            "${DEVELOPER_ID_P12_PASSWORD}" \
            "${APPLE_NOTARY_KEY_P8_BASE64}" \
            "${APPLE_NOTARY_KEY_ID}" \
            "${APPLE_NOTARY_ISSUER_ID}"; do
            if [[ -z "${secret_value}" ]]; then
              echo "The production-release environment is missing an Apple credential." >&2
              exit 1
            fi
          done
          if [[ ! "${APPLE_NOTARY_KEY_ID}" =~ ^[A-Z0-9]{10}$ ]]; then
            echo "APPLE_NOTARY_KEY_ID must be a 10-character App Store Connect key ID." >&2
            exit 1
          fi
          if [[ ! "${APPLE_NOTARY_ISSUER_ID}" \
                =~ ^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$ ]]; then
            echo "APPLE_NOTARY_ISSUER_ID must be an App Store Connect issuer UUID." >&2
            exit 1
          fi

          keychain_path="${RUNNER_TEMP}/mojipond-signing.keychain-db"
          p12_path="${RUNNER_TEMP}/developer-id.p12"
          notary_key_path="${RUNNER_TEMP}/AuthKey_${APPLE_NOTARY_KEY_ID}.p8"
          keychain_password="$(/usr/bin/openssl rand -hex 32)"
          echo "keychain=${keychain_path}" >> "${GITHUB_OUTPUT}"
          echo "notary-key=${notary_key_path}" >> "${GITHUB_OUTPUT}"

          /usr/bin/printf '%s' "${DEVELOPER_ID_P12_BASE64}" \
            | /usr/bin/base64 -D \
            > "${p12_path}"
          /usr/bin/printf '%s' "${APPLE_NOTARY_KEY_P8_BASE64}" \
            | /usr/bin/base64 -D \
            > "${notary_key_path}"
          /bin/chmod 600 "${p12_path}" "${notary_key_path}"

          original_keychains=(
            ${(f)"$(/usr/bin/security list-keychains -d user | tr -d ' \"')"}
          )
          /usr/bin/security create-keychain -p "${keychain_password}" "${keychain_path}"
          /usr/bin/security set-keychain-settings -lut 21600 "${keychain_path}"
          /usr/bin/security unlock-keychain -p "${keychain_password}" "${keychain_path}"
          /usr/bin/security import "${p12_path}" \
            -k "${keychain_path}" \
            -P "${DEVELOPER_ID_P12_PASSWORD}" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          /usr/bin/security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "${keychain_password}" \
            "${keychain_path}"
          /usr/bin/security list-keychains -d user -s \
            "${keychain_path}" \
            "${original_keychains[@]}"

          identities=(
            ${(f)"$(
            /usr/bin/security find-identity -v -p codesigning "${keychain_path}" \
              | /usr/bin/sed -nE \
                's/^[[:space:]]*[0-9]+\)[[:space:]]+[[:xdigit:]]+[[:space:]]+"(Developer ID Application:[^"]+)"$/\1/p'
            )"}
          )
          if (( ${#identities[@]} != 1 )); then
            echo "Expected exactly one Developer ID Application identity in the imported p12." >&2
            exit 1
          fi

          echo "identity=${identities[1]}" >> "${GITHUB_OUTPUT}"

      - name: Build Developer ID package
        env:
          MOJIPOND_SIGNING_IDENTITY: ${{ steps.signing.outputs.identity }}
          MOJIPOND_DEVELOPMENT_TEAM: ${{ vars.APPLE_TEAM_ID }}
          MOJIPOND_REQUIRE_DEVELOPER_ID: "1"
        run: |
          set -euo pipefail
          if [[ ! "${MOJIPOND_DEVELOPMENT_TEAM}" =~ ^[A-Z0-9]{10}$ ]]; then
            echo "APPLE_TEAM_ID must be a 10-character Apple team ID." >&2
            exit 1
          fi
          ./scripts/package-local.sh

      - name: Verify Developer ID package
        shell: zsh {0}
        run: |
          set -euo pipefail
          package_directories=("${PWD}"/Artifacts/releases/MojiPond-*(N))
          if (( ${#package_directories[@]} != 1 )); then
            echo "Expected exactly one package directory." >&2
            exit 1
          fi
          ./scripts/verify-release-package.sh \
            "${package_directories[1]}" \
            developer-id

      - name: Upload Sentry debug symbols
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: flash-corp
          SENTRY_PROJECT: mojipond
        shell: zsh {0}
        run: |
          set -euo pipefail
          if [[ -z "${SENTRY_AUTH_TOKEN}" ]]; then
            echo "The production release is missing SENTRY_AUTH_TOKEN." >&2
            exit 1
          fi

          package_directories=("${PWD}"/Artifacts/releases/MojiPond-*(N))
          if (( ${#package_directories[@]} != 1 )); then
            echo "Expected exactly one package directory." >&2
            exit 1
          fi
          archives=("${package_directories[1]}"/*.xcarchive(N))
          if (( ${#archives[@]} != 1 )); then
            echo "Expected exactly one release archive." >&2
            exit 1
          fi
          symbol_directory="${archives[1]}/dSYMs"
          if [[ ! -d "${symbol_directory}" ]] \
              || [[ -z "$(/usr/bin/find "${symbol_directory}" -name '*.dSYM' -print -quit)" ]]; then
            echo "The release archive does not contain dSYMs." >&2
            exit 1
          fi

          .derived/tools/sentry-cli debug-files upload \
            --org "${SENTRY_ORG}" \
            --project "${SENTRY_PROJECT}" \
            --type dsym \
            --no-sources \
            --wait-for 120 \
            "${symbol_directory}"

      - name: Notarize final ZIP and DMG
        env:
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          MOJIPOND_SIGNING_IDENTITY: ${{ steps.signing.outputs.identity }}
          NOTARY_KEY_PATH: ${{ steps.signing.outputs.notary-key }}
        shell: zsh {0}
        run: |
          set -euo pipefail
          package_directories=("${PWD}"/Artifacts/releases/MojiPond-*(N))
          if (( ${#package_directories[@]} != 1 )); then
            echo "Expected exactly one package directory." >&2
            exit 1
          fi

          package_directory=${package_directories[1]}
          archives=("${package_directory}"/*.xcarchive(N))
          source_zips=("${package_directory}"/*.zip(N))
          if (( ${#archives[@]} != 1 || ${#source_zips[@]} != 1 )); then
            echo "The package directory has an unexpected shape." >&2
            exit 1
          fi

          archive_path=${archives[1]}
          app_path="${archive_path}/Products/Applications/MojiPond.app"
          source_zip=${source_zips[1]}
          public_directory="${PWD}/Artifacts/public-release"
          public_zip="${public_directory}/MojiPond.zip"
          public_dmg="${public_directory}/MojiPond.dmg"
          mkdir -m 0700 "${public_directory}"

          ./scripts/notarize-artifact.sh \
            "${source_zip}" \
            "${RUNNER_TEMP}/zip-notary.json" \
            "${NOTARY_KEY_PATH}" \
            "${APPLE_NOTARY_KEY_ID}" \
            "${APPLE_NOTARY_ISSUER_ID}"

          /usr/bin/xcrun stapler staple "${app_path}"
          /usr/bin/xcrun stapler validate "${app_path}"
          /usr/bin/ditto \
            -c \
            -k \
            --norsrc \
            --noextattr \
            --noqtn \
            --keepParent \
            "${app_path}" \
            "${public_zip}"

          ./scripts/create-dmg.sh "${app_path}" "${public_dmg}"
          /usr/bin/codesign \
            --force \
            --sign "${MOJIPOND_SIGNING_IDENTITY}" \
            --timestamp \
            "${public_dmg}"

          ./scripts/notarize-artifact.sh \
            "${public_dmg}" \
            "${RUNNER_TEMP}/dmg-notary.json" \
            "${NOTARY_KEY_PATH}" \
            "${APPLE_NOTARY_KEY_ID}" \
            "${APPLE_NOTARY_ISSUER_ID}"
          /usr/bin/xcrun stapler staple "${public_dmg}"
          /usr/bin/xcrun stapler validate "${public_dmg}"

          /bin/cp "${package_directory}/BUILD-METADATA.json" "${public_directory}/"
          (
            cd "${public_directory}"
            /usr/bin/shasum -a 256 \
              MojiPond.zip \
              MojiPond.dmg \
              BUILD-METADATA.json \
              > SHA256SUMS.txt
            /usr/bin/shasum -a 256 -c SHA256SUMS.txt
          )

      - name: Keep notarization diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mojipond-notarization-diagnostics-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/zip-notary.json
            ${{ runner.temp }}/zip-notary-log.json
            ${{ runner.temp }}/dmg-notary.json
            ${{ runner.temp }}/dmg-notary-log.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Assess extracted release artifacts
        shell: zsh {0}
        run: |
          set -euo pipefail
          public_directory="${PWD}/Artifacts/public-release"
          extracted_directory="${RUNNER_TEMP}/mojipond-zip-check"
          mount_directory="${RUNNER_TEMP}/mojipond-dmg-check"
          mkdir -m 0700 "${extracted_directory}" "${mount_directory}"

          /usr/bin/ditto \
            -x \
            -k \
            "${public_directory}/MojiPond.zip" \
            "${extracted_directory}"
          extracted_app="${extracted_directory}/MojiPond.app"
          /usr/bin/codesign --verify --deep --strict --verbose=2 "${extracted_app}"
          ./scripts/verify-app-distribution-signature.sh "${extracted_app}"
          /usr/bin/xcrun stapler validate "${extracted_app}"
          /usr/sbin/spctl --assess --type execute --verbose=4 "${extracted_app}"
          ./scripts/verify-app-compatibility.sh "${extracted_app}"

          /usr/bin/hdiutil verify "${public_directory}/MojiPond.dmg"
          ./scripts/verify-dmg-layout.sh \
            "${public_directory}/MojiPond.dmg"
          /usr/sbin/spctl \
            --assess \
            --type open \
            --context context:primary-signature \
            --verbose=4 \
            "${public_directory}/MojiPond.dmg"
          /usr/bin/hdiutil attach \
            -nobrowse \
            -readonly \
            -mountpoint "${mount_directory}" \
            "${public_directory}/MojiPond.dmg"
          trap '/usr/bin/hdiutil detach "${mount_directory}" >/dev/null' EXIT
          /usr/bin/codesign \
            --verify \
            --deep \
            --strict \
            --verbose=2 \
            "${mount_directory}/MojiPond.app"
          /usr/sbin/spctl \
            --assess \
            --type execute \
            --verbose=4 \
            "${mount_directory}/MojiPond.app"

      - name: Generate signed Sparkle appcast
        env:
          GENERATE_APPCAST: ${{ steps.sparkle.outputs.generate-appcast }}
          RELEASE_BUILD: ${{ inputs.build }}
          RELEASE_VERSION: ${{ inputs.version }}
          SIGN_UPDATE: ${{ steps.sparkle.outputs.sign-update }}
          SPARKLE_EDDSA_PRIVATE_KEY: ${{ secrets.SPARKLE_EDDSA_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${SPARKLE_EDDSA_PRIVATE_KEY}" ]]; then
            echo "The production-release environment is missing SPARKLE_EDDSA_PRIVATE_KEY." >&2
            exit 1
          fi
          derived_public_key="$(
            /usr/bin/xcrun swift -e '
              import CryptoKit
              import Foundation

              enum SparkleKeyError: Error {
                  case invalidPrivateKey
              }

              guard
                  let encoded = ProcessInfo.processInfo.environment[
                      "SPARKLE_EDDSA_PRIVATE_KEY"
                  ],
                  let seed = Data(
                      base64Encoded: encoded,
                      options: .ignoreUnknownCharacters
                  ),
                  seed.count == 32
              else {
                  throw SparkleKeyError.invalidPrivateKey
              }
              let privateKey = try Curve25519.Signing.PrivateKey(
                  rawRepresentation: seed
              )
              print(
                  privateKey.publicKey.rawRepresentation
                      .base64EncodedString()
              )
            '
          )"
          shopt -s nullglob
          release_apps=(
            Artifacts/releases/MojiPond-*/*.xcarchive/Products/Applications/MojiPond.app
          )
          if (( ${#release_apps[@]} != 1 )); then
            echo "Expected exactly one packaged app for Sparkle key verification." >&2
            exit 1
          fi
          embedded_public_key="$(
            /usr/libexec/PlistBuddy \
              -c 'Print :SUPublicEDKey' \
              "${release_apps[0]}/Contents/Info.plist"
          )"
          if [[ "${derived_public_key}" != "${embedded_public_key}" ]]; then
            echo "SPARKLE_EDDSA_PRIVATE_KEY does not match the public key embedded in MojiPond." >&2
            exit 1
          fi

          sparkle_private_key="${SPARKLE_EDDSA_PRIVATE_KEY}"
          unset SPARKLE_EDDSA_PRIVATE_KEY

          appcast_source="${RUNNER_TEMP}/mojipond-appcast-source"
          appcast_path="${GITHUB_WORKSPACE}/Artifacts/public-release/appcast.xml"
          mkdir -m 0700 "${appcast_source}"
          cp Artifacts/public-release/MojiPond.zip "${appcast_source}/MojiPond.zip"

          printf '%s' "${sparkle_private_key}" \
            | "${GENERATE_APPCAST}" \
                --ed-key-file - \
                --download-url-prefix \
                  "https://github.com/${GITHUB_REPOSITORY}/releases/download/v${RELEASE_VERSION}/" \
                --link https://mojipond.com/ \
                --maximum-deltas 0 \
                --maximum-versions 1 \
                -o "${appcast_path}" \
                "${appcast_source}"

          printf '%s' "${sparkle_private_key}" \
            | "${SIGN_UPDATE}" \
                --ed-key-file - \
                "${appcast_path}"
          printf '%s' "${sparkle_private_key}" \
            | "${SIGN_UPDATE}" \
                --verify \
                --ed-key-file - \
                "${appcast_path}"

          expected_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${RELEASE_VERSION}/MojiPond.zip"
          actual_url="$(
            xmllint --xpath \
              'string(/*[local-name()="rss"]/*[local-name()="channel"]/*[local-name()="item"][1]/*[local-name()="enclosure"]/@url)' \
              "${appcast_path}"
          )"
          actual_build="$(
            xmllint --xpath \
              'string(/*[local-name()="rss"]/*[local-name()="channel"]/*[local-name()="item"][1]/*[local-name()="version"])' \
              "${appcast_path}"
          )"
          actual_version="$(
            xmllint --xpath \
              'string(/*[local-name()="rss"]/*[local-name()="channel"]/*[local-name()="item"][1]/*[local-name()="shortVersionString"])' \
              "${appcast_path}"
          )"
          actual_length="$(
            xmllint --xpath \
              'string(/*[local-name()="rss"]/*[local-name()="channel"]/*[local-name()="item"][1]/*[local-name()="enclosure"]/@length)' \
              "${appcast_path}"
          )"
          actual_signature="$(
            xmllint --xpath \
              'string(/*[local-name()="rss"]/*[local-name()="channel"]/*[local-name()="item"][1]/*[local-name()="enclosure"]/@*[local-name()="edSignature"])' \
              "${appcast_path}"
          )"
          zip_length="$(stat -f '%z' Artifacts/public-release/MojiPond.zip)"

          if [[ "${actual_url}" != "${expected_url}" \
                || "${actual_build}" != "${RELEASE_BUILD}" \
                || "${actual_version}" != "${RELEASE_VERSION}" \
                || "${actual_length}" != "${zip_length}" \
                || -z "${actual_signature}" ]]; then
            echo "The generated appcast does not match the final release artifact." >&2
            exit 1
          fi
          if ! grep -Fq '<!-- sparkle-signatures:' "${appcast_path}"; then
            echo "The generated appcast is not signed as a feed." >&2
            exit 1
          fi

      - name: Create one draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v${RELEASE_VERSION}"
          release_arguments=(
            "${tag}"
            --draft
            --target "${GITHUB_SHA}"
            --title "MojiPond ${RELEASE_VERSION}"
            --generate-notes
          )
          if [[ "${PRERELEASE}" == "true" ]]; then
            release_arguments+=(--prerelease)
          fi

          gh release create \
            "${release_arguments[@]}" \
            Artifacts/public-release/MojiPond.dmg \
            Artifacts/public-release/MojiPond.zip \
            Artifacts/public-release/appcast.xml \
            Artifacts/public-release/BUILD-METADATA.json \
            Artifacts/public-release/SHA256SUMS.txt

      - name: Remove temporary signing material
        if: always()
        env:
          KEYCHAIN_PATH: ${{ steps.signing.outputs.keychain }}
          NOTARY_KEY_PATH: ${{ steps.signing.outputs.notary-key }}
        shell: bash
        run: |
          set -euo pipefail
          cleanup_status=0

          if [[ -n "${KEYCHAIN_PATH}" && -e "${KEYCHAIN_PATH}" ]] \
            && ! security delete-keychain "${KEYCHAIN_PATH}"; then
            echo "Failed to delete the temporary signing keychain." >&2
            cleanup_status=1
          fi

          temporary_files=(
            "${RUNNER_TEMP}/developer-id.p12"
            "${NOTARY_KEY_PATH}"
            "${RUNNER_TEMP}/zip-notary.json"
            "${RUNNER_TEMP}/dmg-notary.json"
          )
          for temporary_file in "${temporary_files[@]}"; do
            if [[ -n "${temporary_file}" ]] \
              && ! rm -f "${temporary_file}"; then
              echo "Failed to delete temporary signing material: ${temporary_file}" >&2
              cleanup_status=1
            fi
          done

          exit "${cleanup_status}"
