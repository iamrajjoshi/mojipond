name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and deterministic tests
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify tracked files contain no release secrets
        shell: bash
        run: |
          sensitive_files="$(
            git ls-files \
              | awk '
                  /(^|\/)\.env\.example$/ { next }
                  /(^|\/)\.env(\..*)?$/ { print; next }
                  /(^|\/)[^\/]+\.(p8|p12|pem|key|mobileprovision|cer)$/ { print; next }
                  /(^|\/)[^\/]*(private|signing)[_-]?key[^\/]*$/ { print }
                '
          )"
          if [[ -n "$sensitive_files" ]]; then
            echo "Potential secret-bearing files are tracked:"
            echo "$sensitive_files"
            exit 1
          fi

          private_key_pattern='BEGIN (RSA |EC |OPENSSH )?PRIVATE'" KEY"
          if git grep -I -n -E "$private_key_pattern" -- .
          then
            echo "Private key material must never be committed."
            exit 1
          else
            grep_status=$?
            if (( grep_status != 1 )); then
              echo "The private-key scan failed with status ${grep_status}." >&2
              exit "${grep_status}"
            fi
          fi

          if git grep -I -n -E \
            '(NOTARIZATION_PASSWORD|AC_PASSWORD)[[:space:]]*=[[:space:]]*[^$[:space:]]{8,}' \
            -- .
          then
            echo "A likely hard-coded release secret was found."
            exit 1
          else
            grep_status=$?
            if (( grep_status != 1 )); then
              echo "The release-secret scan failed with status ${grep_status}." >&2
              exit "${grep_status}"
            fi
          fi

      - name: Install pinned XcodeGen
        env:
          XCODEGEN_VERSION: 2.46.0
          XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
        run: |
          mkdir -p .derived/tools
          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip" \
            --output .derived/tools/xcodegen.zip
          printf '%s  %s\n' \
            "${XCODEGEN_SHA256}" \
            ".derived/tools/xcodegen.zip" \
            | shasum -a 256 -c -
          ditto \
            -x \
            -k \
            .derived/tools/xcodegen.zip \
            .derived/tools
          echo "${GITHUB_WORKSPACE}/.derived/tools/xcodegen/bin" \
            >> "${GITHUB_PATH}"
          .derived/tools/xcodegen/bin/xcodegen --version

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build
        run: |
          xcodebuild \
            -project MojiPond.xcodeproj \
            -scheme MojiPond \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath .derived/ci \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Run deterministic tests
        run: |
          xcodebuild \
            -project MojiPond.xcodeproj \
            -scheme MojiPond \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath .derived/ci \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Test signed update feed generator
        run: /usr/bin/xcrun swift scripts/test-update-feed-generator.swift

      - name: Check shell scripts
        run: /bin/zsh -n scripts/*.sh

      - name: Build Universal Release app
        run: |
          xcodebuild \
            -project MojiPond.xcodeproj \
            -scheme MojiPond \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath .derived/ci-release \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS='arm64 x86_64' \
            ONLY_ACTIVE_ARCH=NO \
            build
          lipo \
            .derived/ci-release/Build/Products/Release/MojiPond.app/Contents/MacOS/MojiPond \
            -verify_arch arm64 x86_64

  website-quality:
    name: Website quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install website dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting and types
        run: |
          pnpm site:format:check
          pnpm site:check

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Build website
        run: pnpm site:build

      - name: Install Chromium
        run: pnpm --filter @mojipond/site exec playwright install --with-deps chromium

      - name: Test website in desktop and mobile viewports
        run: pnpm site:test

      - name: Keep browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: website-test-diagnostics
          path: |
            website/playwright-report
            website/test-results
          if-no-files-found: ignore
          retention-days: 7
