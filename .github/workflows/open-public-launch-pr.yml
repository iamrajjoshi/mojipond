name: Open public launch pull request

on:
  push:
    branches:
      - raj--repo--public-launch

permissions:
  contents: write
  pull-requests: write

jobs:
  open-and-queue:
    runs-on: ubuntu-latest
    steps:
      - name: Open pull request and request auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          pr_url="$(
            gh pr list \
              --repo "${GITHUB_REPOSITORY}" \
              --head "${GITHUB_REF_NAME}" \
              --state open \
              --json url \
              --jq '.[0].url // empty'
          )"

          if [[ -z "${pr_url}" ]]; then
            pr_url="$(
              gh pr create \
                --repo "${GITHUB_REPOSITORY}" \
                --base main \
                --head "${GITHUB_REF_NAME}" \
                --title ':sparkles: feat[repo]: prepare MojiPond for public launch' \
                --body-file - <<'EOF'
          ## Description of the change

          - simplifies the app menu, pack controls, and settings navigation
          - adds isolated macOS UI testing and opt-out Sentry crash reporting
          - finishes the MojiPond website hero and interactive picker
          - adds MIT licensing, bundled notices, and private security reporting
          - removes unused website artwork before the public-history cleanup

          Generated with Codex.

          ## Test plan

          - Swift build and deterministic tests in CI
          - website diagnostics, formatting, production build, and browser tests in CI
          - local production site build and licensing/package integrity checks

          ## Considerations

          The repository history and visibility are updated only after this PR passes CI and merges. A verified private local bundle preserves the pre-rewrite repository.
          EOF
            )"
          fi

          gh pr merge \
            --repo "${GITHUB_REPOSITORY}" \
            "${pr_url}" \
            --auto \
            --squash \
            --delete-branch
