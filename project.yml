name: MojiPond

options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: targeted
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES

targets:
  MojiPond:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources
        excludes:
          - Branding
          - Info.plist
          - MojiPond.entitlements
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rajjoshi.MojiPond
        PRODUCT_NAME: MojiPond
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/MojiPond.entitlements
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        MOJIPOND_UPDATE_FEED_URL: ""
        MOJIPOND_UPDATE_SIGNATURE_ALGORITHM: ""
        MOJIPOND_UPDATE_PUBLIC_KEY_BASE64: ""
        MOJIPOND_UPDATE_TEAM_IDENTIFIER: ""
    scheme:
      gatherCoverageData: true
      testTargets:
        - MojiPondTests

  MojiPondTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: MojiPond
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rajjoshi.MojiPondTests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO

  MojiPondIntegrationFixture:
    type: application
    platform: macOS
    sources:
      - path: IntegrationFixture
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rajjoshi.MojiPondIntegrationFixture
        PRODUCT_NAME: MojiPondIntegrationFixture
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: MojiPond Integration Fixture
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
    scheme:
      testTargets:
        - MojiPondIntegrationFixtureUITests

  MojiPondUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: UITests/MojiPond
    dependencies:
      - target: MojiPond
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rajjoshi.MojiPondUITests
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
    scheme:
      testTargets:
        - MojiPondUITests

  MojiPondIntegrationFixtureUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: UITests/IntegrationFixture
    dependencies:
      - target: MojiPondIntegrationFixture
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rajjoshi.MojiPondIntegrationFixtureUITests
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
